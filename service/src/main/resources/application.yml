spring:
  application:
    name: tiny-bank
  jmx:
    enabled: true
  # The SSL meter binder eagerly loads all registered SSL bundles at startup,
  # which fails when the generated certs are not present (fresh checkout, tests).
  # The bundle itself is only used when mtls.enabled=true.
  autoconfigure:
    exclude: org.springframework.boot.actuate.autoconfigure.ssl.SslObservabilityAutoConfiguration
  # SSL bundle for mTLS (used when mtls.enabled=true)
  # Spring Boot SSL Bundle configured to use generated PKCS12 client keystore and truststore
  # Generate the certs with: ./mtls-certs/mtls-certificate-setup.sh
  ssl:
    bundle:
      jks:
        mtls-client:
          keystore:
            location: target/generated-certs/client.p12
            password: changeit
            type: PKCS12
          truststore:
            location: target/generated-certs/client-truststore.p12
            password: changeit
            type: PKCS12
  datasource:
    url: jdbc:postgresql://localhost:15432/tiny_bank_db
    username: pipo
    password: test123
    driver-class-name: org.postgresql.Driver
    # note: all hikari timeouts are in milliseconds
    hikari:
      register-mbeans: true
      maximum-pool-size: 30
      minimum-idle: 4
      connection-timeout: 3000
      # connection-test-query: SELECT 1
      validation-timeout: 400
      idle-timeout: 60000
      max-lifetime: 80000
      pool-name: TinyBankDbConPool
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: create-drop
    # properties:
    #   hibernate:
    #     dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 18080

management:
  endpoints:
    jmx:
      exposure:
        include: "*"
    web:
      exposure:
        include: health,metrics,prometheus,env,circuitbreakers
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      system_under_test: tiny-bank
      test_environment: silver
      service: tiny-bank-service
  health:
    circuitbreakers:
      enabled: true
    # The SSL health indicator eagerly loads all registered SSL bundles at
    # startup, see spring.autoconfigure.exclude above.
    ssl:
      enabled: false
  endpoint:
    health:
      show-details: always
      group:
        liveness:
          include: ping
        readiness:
          include: db,circuitBreakers

# Toggle mTLS on/off (can be overridden via -Dmtls.enabled=true or env MTLS_ENABLED=true)
mtls:
  enabled: false

# HTTP and HTTPS endpoints for the stubbed remote services
# The https endpoints (with client auth) are used when mtls.enabled=true
remote:
  account:
    service:
      url:
        http: "http://localhost:30123"
        https: "https://localhost:31123"
  balance:
    service:
      url:
        http: "http://localhost:30124"
        https: "https://localhost:31124"

# Remote services via toxiproxy (example)
