spring.application.name=tiny-bank
server.port=18080

spring.jmx.enabled=true
management.endpoints.jmx.exposure.include=*

management.endpoints.web.exposure.include=health,metrics,prometheus,env,circuitbreakers
management.prometheus.metrics.export.enabled=true
management.metrics.tags.system_under_test=tiny-bank
management.metrics.tags.test_environment=silver
management.metrics.tags.service=tiny-bank-service

# remote services
remote.account.service.url=http://localhost:30123
remote.balance.service.url=http://localhost:30124

# remote services via toxiproxy
#remote.account.service.url=http://localhost:20123
#remote.balance.service.url=http://localhost:20124

# Balance Service Circuit Breaker Settings
# Exposes circuit breaker status via /actuator/health endpoint
resilience4j.circuitbreaker.instances.balanceService.registerHealthIndicator=true
# Reduced number of calls to consider for failure rate calculation
resilience4j.circuitbreaker.instances.balanceService.slidingWindowSize=10
# Time in milliseconds the circuit stays open before transitioning to half-open
resilience4j.circuitbreaker.instances.balanceService.waitDurationInOpenState=5000
# Number of calls allowed in half-open state before deciding to close or re-open (reduced for faster testing)
resilience4j.circuitbreaker.instances.balanceService.permittedNumberOfCallsInHalfOpenState=2
# Automatically transition from open to half-open without calls
resilience4j.circuitbreaker.instances.balanceService.automaticTransitionFromOpenToHalfOpenEnabled=true
# Use count-based window for faster recovery evaluation under low load conditions
resilience4j.circuitbreaker.instances.balanceService.slidingWindowType=TIME_BASED
# Set a maximum wait duration in half-open state
resilience4j.circuitbreaker.instances.balanceService.maxWaitDurationInHalfOpenState=5000
# The circuit breaker considers any call that takes longer than the specified duration as "slow"
# When the percentage of slow calls exceeds the threshold, the circuit breaker will open
# This is particularly useful for detecting degraded services that haven't completely failed
# but are performing poorly enough to impact user experience
resilience4j.circuitbreaker.instances.balanceService.slowCallRateThreshold=50
# Any call taking longer than 800ms is considered a "slow call" (reduced from 1000ms)
resilience4j.circuitbreaker.instances.balanceService.slowCallDurationThreshold=800
# Lower threshold for minimal recovery
resilience4j.circuitbreaker.instances.balanceService.minimumNumberOfCalls=3
# Set a lower failure threshold for closing the circuit
resilience4j.circuitbreaker.instances.balanceService.failureRateThreshold=50

# Resilience4j Circuit Breaker Configuration
# Account Service Circuit Breaker Settings
# Exposes circuit breaker status via /actuator/health endpoint
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
# Reduced number of calls to consider for failure rate calculation
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
# Time in milliseconds the circuit stays open before transitioning to half-open
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=5000
# Number of calls allowed in half-open state before deciding to close or re-open (reduced for faster testing)
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=2
# Automatically transition from open to half-open without calls
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true
# Use count-based window for faster recovery evaluation under low load conditions
resilience4j.circuitbreaker.instances.accountService.slidingWindowType=TIME_BASED
# Set a maximum wait duration in half-open state
resilience4j.circuitbreaker.instances.accountService.maxWaitDurationInHalfOpenState=5000
# These settings work the same way as for the Balance Service
# The circuit breaker will open when 50% of calls take longer than 800ms
#resilience4j.circuitbreaker.instances.accountService.slowCallRateThreshold=50
#resilience4j.circuitbreaker.instances.accountService.slowCallDurationThreshold=800
# Lower threshold for minimal recovery
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=3
# Set a lower failure threshold for closing the circuit
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=20

# PostgreSQL settings
spring.datasource.url=jdbc:postgresql://localhost:15432/tiny_bank_db
spring.datasource.username=pipo
spring.datasource.password=test123
spring.datasource.driver-class-name=org.postgresql.Driver

# Enable connection pool metrics
spring.datasource.hikari.register-mbeans=true

# JPA settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=create-drop

# Logging
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
