spring.application.name=tiny-bank
server.port=18080

spring.jmx.enabled=true
management.endpoints.jmx.exposure.include=*

management.endpoints.web.exposure.include=health,metrics,prometheus,env,circuitbreakers
management.prometheus.metrics.export.enabled=true
management.metrics.tags.system_under_test=tiny-bank
management.metrics.tags.test_environment=silver
management.metrics.tags.service=tiny-bank-service

# remote services
#remote.account.service.url=http://localhost:30123
#remote.balance.service.url=http://localhost:30124

# remote services via toxiproxy
remote.account.service.url=http://localhost:20123
remote.balance.service.url=http://localhost:20124

# Balance Service Circuit Breaker Settings
# Exposes circuit breaker status via /actuator/health endpoint
resilience4j.circuitbreaker.instances.balanceService.registerHealthIndicator=true
# Number of calls to consider for failure rate calculation
resilience4j.circuitbreaker.instances.balanceService.slidingWindowSize=10
# Minimum number of calls required before calculating failure rate
resilience4j.circuitbreaker.instances.balanceService.minimumNumberOfCalls=5
# Percentage of failures required to open the circuit (50%)
resilience4j.circuitbreaker.instances.balanceService.failureRateThreshold=50
# Time in milliseconds the circuit stays open before transitioning to half-open (5 seconds)
resilience4j.circuitbreaker.instances.balanceService.waitDurationInOpenState=5000
# Number of calls allowed in half-open state before deciding to close or re-open
resilience4j.circuitbreaker.instances.balanceService.permittedNumberOfCallsInHalfOpenState=3
# Automatically transition from open to half-open without calls
resilience4j.circuitbreaker.instances.balanceService.automaticTransitionFromOpenToHalfOpenEnabled=true
# The circuit breaker considers any call that takes longer than the specified duration as "slow"
# When the percentage of slow calls exceeds the threshold, the circuit breaker will open
# This is particularly useful for detecting degraded services that haven't completely failed
# but are performing poorly enough to impact user experience
#resilience4j.circuitbreaker.instances.balanceService.slowCallRateThreshold=50
# Any call taking longer than 1000ms (1 second) is considered a "slow call"
#resilience4j.circuitbreaker.instances.balanceService.slowCallDurationThreshold=1000

# Resilience4j Circuit Breaker Configuration
# Account Service Circuit Breaker Settings
# Exposes circuit breaker status via /actuator/health endpoint
resilience4j.circuitbreaker.instances.accountService.registerHealthIndicator=true
# Number of calls to consider for failure rate calculation
resilience4j.circuitbreaker.instances.accountService.slidingWindowSize=10
# Minimum number of calls required before calculating failure rate
resilience4j.circuitbreaker.instances.accountService.minimumNumberOfCalls=5
# Percentage of failures required to open the circuit (50%)
resilience4j.circuitbreaker.instances.accountService.failureRateThreshold=50
# Time in milliseconds the circuit stays open before transitioning to half-open (5 seconds)
resilience4j.circuitbreaker.instances.accountService.waitDurationInOpenState=5000
# Number of calls allowed in half-open state before deciding to close or re-open
resilience4j.circuitbreaker.instances.accountService.permittedNumberOfCallsInHalfOpenState=3
# Automatically transition from open to half-open without calls
resilience4j.circuitbreaker.instances.accountService.automaticTransitionFromOpenToHalfOpenEnabled=true
# These settings work the same way as for the Balance Service
# The circuit breaker will open when 50% of calls take longer than 1000ms
#resilience4j.circuitbreaker.instances.accountService.slowCallRateThreshold=50
#resilience4j.circuitbreaker.instances.accountService.slowCallDurationThreshold=1000






